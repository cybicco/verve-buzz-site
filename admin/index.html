<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Verve leads</title><style>body{background:#07050d;color:#f4f1fb;font:15px system-ui;padding:30px;max-width:1100px;margin:auto}input,button{padding:12px 16px;border-radius:10px;border:1px solid #333;background:#130e24;color:#fff;font:inherit}button{background:linear-gradient(100deg,#c10fff,#ff9a1a);color:#14081f;font-weight:700;border:0;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #2a2240;text-align:left;vertical-align:top;font-size:13.5px}th{color:#ffcd57}.e{color:#ff6b7a}</style></head><body><h1>Verve leads</h1><p><input id="k" type="password" placeholder="Access key" autocomplete="current-password"> <button id="go">View leads</button> <span id="m" class="e"></span></p><div id="o"></div><script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){m.textContent='';const r=await fetch('/api/leads',{headers:{'x-leads-key':k.value}});if(!r.ok){m.textContent='Access denied';return}const j=await r.json();o.innerHTML='<p>'+j.leads.length+' lead(s)</p><table><tr><th>When (IST)</th><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Plan</th><th>Needs / message</th></tr>'+j.leads.map(l=>'<tr><td>'+esc(new Date(l.created_ms).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))+'</td><td>'+esc(l.name)+'</td><td>'+esc(l.email)+'</td><td>'+esc(l.phone)+'</td><td>'+esc(l.company)+'</td><td>'+esc(l.plan)+'</td><td>'+esc(l.needs)+'<br>'+esc(l.message)+'</td></tr>').join('')+'</table>'}
go.onclick=load;k.onkeydown=e=>{if(e.key==='Enter')load()};</script></body></html>
